<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>

  <div class="sky-container" id="skyContainer">
    <div id="skyNoteLayer" class="sky-note-layer"></div>
    <div id="audioVisualizer" class="visualizer-container"></div>

<div class="sky-info">
  <p class="label" id="skyLabel" data-i18n="nowPlaying">Now playing:</p>
  <div class="sky-title-window">
    <h2 id="skyTitle" data-i18n="nothingPlaying">Nothing playing</h2>
  </div>
</div>

    <div class="jukebox-wrapper" id="jukeboxContainer">
      <div id="particleSystem"></div>
      
      <img src="../../assets/jukebox.png" class="jukebox-img">
      
      <div class="status-overlay" id="statusOverlay">
        <img src="../../assets/play_icon.png">
      </div>
    </div>
  </div>

  <div class="card">
    <div id="importNotice" class="import-notice hidden">
      <p data-i18n-html="importNotice">To use the player, you must import the game songs in <strong>Settings</strong> first.</p>
      <button id="btnNoticeConfig" class="notice-btn" data-i18n="goToSettings">Go to Settings</button>
      <button id="btnDismissNotice" class="notice-dismiss" title="Close" data-i18n-title="close">×</button>
    </div>

    <div class="top-bar">
      <div class="search-box">
        <img src="../../assets/search.png" class="icon-ui">
        <input type="text" id="searchInput" placeholder="Search..." title="Search songs" data-i18n-placeholder="searchPlaceholder" data-i18n-title="searchTitle">
      </div>
      <button id="btnReload" class="icon-btn" title="Restart" data-i18n-title="restart">
        <img src="../../assets/reload.png" class="icon-ui">
      </button>
      <button id="btnSettings" class="icon-btn" title="Settings" data-i18n-title="settings">
        <img src="../../assets/settings.png" class="icon-ui">
      </button>
    </div>

    <div class="track-info">
      <h3 id="trackTitle" data-i18n="selectSong">Select a song</h3>
    </div>

    <div class="progress-wrapper">
      <span id="currTime">0:00</span>
      <input type="range" id="progressBar" value="0" min="0" step="1" title="Seek" data-i18n-title="seek">
      <span id="totTime">0:00</span>
    </div>

    <div class="controls">
      <button id="btnPrev" class="ctrl-btn small" title="Previous track" data-i18n-title="prevTrack">⏮</button>
      <button id="btnPlayPause" class="ctrl-btn big" title="Play / Pause" data-i18n-title="playPause">▶</button>
      <button id="btnNext" class="ctrl-btn small" title="Next track" data-i18n-title="nextTrack">⏭</button>
    </div>

    <div class="shuffle-section">
      <button id="btnShuffle" class="shuffle-btn" title="Change random mode" data-i18n-title="changeMode">
        <img src="../../assets/shuffle.png" class="icon-shuffle">
        <span id="shuffleText" data-i18n="modeOst">Random: OST</span>
      </button>
    </div>

    <div class="volume-wrapper">
      <img src="../../assets/volume.png" id="volumeIcon" class="icon-ui" title="Mute / Unmute" data-i18n-title="mute">
      <input type="range" id="volumeBar" min="0" max="1" step="0.05" value="1" title="Volume" data-i18n-title="volume">
    </div>

    <div id="searchResultsContainer" class="search-results-container hidden">
      <ul id="searchResultsList" class="scroll-list search-results-list"></ul>
    </div>

    <div class="library" id="librarySection">
      
      <details id="detDiscs" class="library-details">
        <summary class="radio-header">
          <div class="header-title header-title-library">
            <img src="../../assets/disc_icon.png" class="icon-library"> 
            <span><span data-i18n="musicDiscs">Music Discs</span> (<span id="cntDiscs">0</span>)</span>
          </div>
          <span class="arrow">▼</span>
        </summary>
        <ul id="listDiscs" class="scroll-list"></ul>
      </details>
      
      <div class="library-spacer"></div>
      
      <details id="detOst" class="library-details">
        <summary class="radio-header">
          <div class="header-title header-title-library">
            <img src="../../assets/piano.png" class="icon-library">
            <span><span data-i18n="soundtrack">Soundtrack</span> (<span id="cntOst">0</span>)</span>
          </div>
          <span class="arrow">▼</span>
        </summary>
        <ul id="listOst" class="scroll-list"></ul>
      </details>

    </div>

</body>
</html>
